name: CI / Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run --locked --extra dev ruff check src/ tests/

      - name: Run tests with pytest and coverage
        run: |
          uv run --locked --extra dev pytest --cov=src/fw_diag_tool --cov-report=xml --junitxml=junit.xml -v

      - name: Build and smoke-test isolated wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv build
          uv venv --python "${{ matrix.python-version }}" .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          wheel_python="$GITHUB_WORKSPACE/.wheel-smoke/bin/python"
          wheel_cli="$GITHUB_WORKSPACE/.wheel-smoke/bin/fw-diag"
          cd "$RUNNER_TEMP"
          test "$("$wheel_cli" --version)" = "1.0.0"
          "$wheel_python" -c 'from fw_diag_tool.i2c.engine import I2CDiagnosticEngine; from fw_diag_tool.resources import load_i2c_sample; assert I2CDiagnosticEngine().analyze_csv_content(load_i2c_sample()).total_transactions > 0'

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
