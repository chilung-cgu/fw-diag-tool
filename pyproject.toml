[project]
name = "fw-diag-tool"
version = "1.0.0"
description = "Firmware Engineering Suite: I2C/PMBus, PCIe AER, SPI Flash, UART Crash Dump, MCTP/IPMB protocol analysis with waveform visualization and code generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
fw-diag = "fw_diag_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]


[tool.coverage.run]
source = ["src/fw_diag_tool"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
precision = 2


[tool.ruff.lint]
ignore = [
    "B008",   # Typer requires function calls in defaults
    "C408",   # dict() is used by Plotly API convention
    "BLE001", # Blind exception catching is intentional for user-facing error handling
    "S112",   # try-except-continue is intentional for batch parsing resilience
    "RUF012", # Mutable class attributes are intentional for Plotly color maps
]
