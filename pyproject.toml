[project]
name = "fw-diag-tool"
version = "1.5.0"
description = "Firmware Engineering Suite: I2C/PMBus, PCIe AER, SPI Flash, UART Crash Dump, MCTP/IPMB protocol analysis with waveform visualization and code generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "streamlit>=1.62.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]

[project.urls]
Documentation = "https://github.com/chilung-cgu/fw-diag-tool#readme"
Source = "https://github.com/chilung-cgu/fw-diag-tool"
Issues = "https://github.com/chilung-cgu/fw-diag-tool/issues"
Changelog = "https://github.com/chilung-cgu/fw-diag-tool/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = [
    "fpdf2>=2.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0,<7.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0,<2.0.0",
    "mkdocs>=1.6.1,<2.0.0",
]

[project.scripts]
fw-diag = "fw_diag_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_diag_tool"]
force-include = { "docs" = "fw_diag_tool/docs" }

[tool.hatch.build.targets.sdist]
exclude = [
    "/site",
    "/build",
    "/dist",
    "/tests",
    "/test-results",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/htmlcov",
    "/.coverage",
    "/coverage.xml",
    "/junit.xml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]


[tool.coverage.run]
source = ["src/fw_diag_tool"]
omit = ["*/__pycache__/*", "*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "fw_diag_tool.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*", "plotly.*", "yaml.*"]
follow_imports = "skip"
ignore_missing_imports = true


[tool.ruff.lint]
ignore = [
    "B008",   # Typer requires function calls in defaults
    "C408",   # dict() is used by Plotly API convention
    "BLE001", # Blind exception catching is intentional for user-facing error handling
    "S112",   # try-except-continue is intentional for batch parsing resilience
    "RUF012", # Mutable class attributes are intentional for Plotly color maps
]
